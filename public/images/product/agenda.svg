oach.</text><g transform="translate(340 220)"><rect width="410" height="160" fill="url(#c)" stroke="#e4e9e6" rx="12"/><rect width="120" height="30" x="10" y="10" fill="#e8f5ff" rx="6"/><text x="70" y="30" fill="#2a8aff" font-family="Inter" font-size="12" font-weight="600" text-anchor="middle">Cadence auto + personnalisation</text><text x="70" y="65" fill="#64748b" font-size="11" text-anchor="middle">4 cadences : 1/mois → 2/semaine</text><text x="70" y="85" fill="#64748b" font-size="11" text-anchor="middle">Personnalisable par client</text><text x="70" y="100" fill="#64748b" font-size="11" text-anchor="middle">Recalcul auto si changement</text><rect width="410" height="160" x="430" fill="url(#c)" stroke="#e4e9e6" rx="12"/><rect width="120" height="30" x="440" y="10" fill="#e8f5e9" rx="6"/><text x="645" y="30" fill="#16a34a" font-family="Inter" font-size="12" font-weight="600" text-anchor="middle">Rappels multi-canal</text><text x="645" y="65" fill="#64748b" font-size="11" text-anchor="middle">Slack + Email + Push + ICS</text><text x="645" y="85" fill="#64748b" font-size="11" text-anchor="middle">J-1, H-1, H-0, H+15min</text><text x="645" y="100" fill="#64748b" font-size="11" text-anchor="middle">Personnalisable par client</text><text x="645" y="140" fill="#16a34a" font-size="11" text-anchor="middle">▶ Configurer les rappels</text><rect width="410" height="160" y="180" fill="url(#c)" stroke="#e4e9e6" rx="12"/><rect width="120" height="30" x="10" y="10" fill="#fef3c7" rx="6"/><text x="70" y="30" fill="#ca8a04" font-family="Inter" font-size="12" font-weight="600" text-anchor="middle">Gestion retards &amp; absences</text><text x="70" y="65" fill="#64748b" font-size="11" text-anchor="middle">Alerte 15min avant si absent</text><text x="70" y="85" fill="#64748b" font-size="11" text-anchor="middle">Relance H+15min + report 1-clic</text><text x="70" y="105" fill="#64748b" font-size="11" text-anchor="middle">Stats ponctualité par client</text><text x="70" y="140" fill="#ca8a04" font-size="11" text-anchor="middle">▶ Voir le dashboard</text><rect width="410" height="160" x="430" y="180" fill="url(#c)" stroke="#e4e9e6" rx="12"/><rect width="120" height="30" x="440" y="10" fill="#e8f5ff" rx="6"/><text x="645" y="30" fill="#2a8aff" font-family="Inter" font-size="12" font-weight="600" text-anchor="middle">Calendrier ICS abonnable</text><text x="645" y="65" fill="#64748b" font-size="11" text-anchor="middle">Token par staff (régénérable)</text><text x="645" y="85" fill="#64748b" font-size="11" text-anchor="middle">Google / Apple / Outlook / Calendly</text><text x="645" y="105" fill="#64748b" font-size="11" text-anchor="middle">Filtré par rôle (coach ≠ mental)</text><text x="645" y="140" fill="#2a8aff" font-size="11" text-anchor="middle">▶ Générer le token ICS</text></g><g transform="translate(340 420)"><rect width="410" height="140" fill="url(#c)" stroke="#e4e9e6" rx="12"/><rect width="120" height="30" x="10" y="10" fill="#e8e8f5" rx="6"/><text x="70" y="30" fill="#433bff" font-family="Inter" font-size="12" font-weight="600" text-anchor="middle">Vue agenda coach</text><text x="70" y="65" fill="#64748b" font-size="11" text-anchor="middle">Semaine / Mois / Liste / Charge</text><text x="70" y="85" fill="#64748b" font-size="11" text-anchor="middle">Filtres : client, type, statut</text><text x="70" y="105" fill="#64748b" font-size="11" text-anchor="middle">Drag-and-drop report + création rapide</text><text x="70" y="120" fill="#433bff" font-size="11" text-anchor="middle">▶ Ouvrir l&apos;agenda</text><rect width="410" height="140" x="430" fill="url(#c)" stroke="#e4e9e6" rx="12"/><rect width="120" height="30" x="440" y="10" fill="#fef3c7" rx="6"/><text x="645" y="30" fill="#ca8a04" font-family="Inter" font-size="12" font-weight="600" text-anchor="middle">Intégré au journal coaching</text><text x="645" y="65" fill="#64748b" font-size="11" text-anchor="middle">Entrée auto post-appel (pré-remplie)</text><text x="645" y="85" fill="#64748b" font-size="11" text-anchor="middle">Client, date, type, durée auto</text><text x="645" y="105" fill="#64748b" font-size="11" text-anchor="middle">Vue charge : nb appels/semaine</text><text x="645" y="125" fill="#ca8a04" font-size="11" text-anchor="middle">▶ Voir l&apos;intégration</text></g><rect width="840" height="56" x="340" y="580" fill="#f7f5f1" stroke="#e4e9e6" rx="12"/><text x="380" y="625" fill="#2a8aff" font-family="Inter" font-size="15" font-weight="600">Spécifications techniques</text><g fill="#64748b" font-family="Inter" font-size="12"><text x="380" y="620">🔑 Token calendrier par staff (régénérable, révocable, scope)</text><text x="620" y="620">🔄 Sync Google / Apple / Outlook natif</text><text x="380" y="635">🔗 Webhook call.scheduled / completed / missed</text><text x="620" y="635">📝 Intégré journal : entrée auto post-appel</text></g><rect width="380" height="56" x="340" y="600" fill="url(#d)" filter="url(#b)" rx="12"/><text x="530" y="35" fill="#fff" font-family="Inter" font-size="15" font-weight="700" text-anchor="middle">Rejoindre Optibilan Agenda</text><text x="510" y="35" fill="#fff" dominant-baseline="middle" font-size="14" text-anchor="middle">→</text><rect width="180" height="56" x="760" y="600" fill="transparent" stroke="#2a8aff" stroke-width="1.5" rx="12"/><text x="850" y="35" fill="#2a8aff" font-family="Inter" font-size="15" font-weight="600" text-anchor="middle">Configurer l&apos;agenda</text></svg>