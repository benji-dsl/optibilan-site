<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F7F5F1"/>
      <stop offset="100%" style="stop-color:#FFFFFF"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#F7F5F1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2A8AFF"/>
      <stop offset="100%" style="stop-color:#1466C4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2A8AFF" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <rect width="1200" height="700" fill="url(#bgGrad)"/>
  
  <!-- Header Bar -->
  <rect x="40" y="30" width="1120" height="56" rx="12" fill="#FFFFFF" stroke="#E4E9E6" stroke-width="1" filter="url(#shadow)"/>
  <text x="60" y="65" font-family="Inter, system-ui" font-size="15" font-weight="600" fill="#23211C">Appels & Agenda</text>
  <circle cx="1120" cy="58" r="16" fill="#E8F5FF"/>
  <text x="1120" y="62" font-family="Inter" font-size="14" fill="#2A8AFF" text-anchor="middle" dominant-baseline="middle">⋯</text>
  
  <!-- Sidebar -->
  <rect x="40" y="110" width="240" height="540" rx="16" fill="#FFFFFF" stroke="#E4E9E6" stroke-width="1"/>
  <text x="60" y="145" font-family="Inter" font-size="13" font-weight="600" fill="#23211C">MENU</text>
  <g font-family="Inter" font-size="14" fill="#64748B">
    <text x="60" y="185">Calendrier</text>
    <text x="60" y="220" font-weight="600" fill="#23211C">Rappels</text>
    <text x="60" y="255">Retards</text>
    <text x="60" y="290">ICS</text>
    <text x="60" y="325">Vue coach</text>
  </g>
  
  <!-- Main Content -->
  <rect x="300" y="110" width="860" height="540" rx="16" fill="#FFFFFF" stroke="#E4E9E6" stroke-width="1"/>
  
  <!-- Header -->
  <text x="340" y="155" font-family="Inter" font-size="22" font-weight="700" fill="#23211C">L'agenda qui suit votre cadence</text>
  <text x="340" y="185" font-size="14" fill="#64748B">Cadence auto, rappels multi-canal, gestion retards, ICS abonnable, vue coach.</text>
  
  <!-- Feature Cards -->
  <g transform="translate(340, 220)">
    <rect x="0" y="0" width="410" height="160" rx="12" fill="url(#cardGrad)" stroke="#E4E9E6"/>
    <rect x="10" y="10" width="120" height="30" rx="6" fill="#E8F5FF"/>
    <text x="70" y="30" font-family="Inter" font-size="12" font-weight="600" fill="#2A8AFF" text-anchor="middle">Cadence auto + personnalisation</text>
    <text x="70" y="65" font-size="11" fill="#64748B" text-anchor="middle">4 cadences : 1/mois → 2/semaine</text>
    <text x="70" y="85" font-size="11" fill="#64748B" text-anchor="middle">Personnalisable par client</text>
    <text x="70" y="100" font-size="11" fill="#64748B" text-anchor="middle">Recalcul auto si changement</text>
    
    <rect x="430" y="0" width="410" height="160" rx="12" fill="url(#cardGrad)" stroke="#E4E9E6"/>
    <rect x="440" y="10" width="120" height="30" rx="6" fill="#E8F5E9"/>
    <text x="645" y="30" font-family="Inter" font-size="12" font-weight="600" fill="#16A34A" text-anchor="middle">Rappels multi-canal</text>
    <text x="645" y="65" font-size="11" fill="#64748B" text-anchor="middle">Slack + Email + Push + ICS</text>
    <text x="645" y="85" font-size="11" fill="#64748B" text-anchor="middle">J-1, H-1, H-0, H+15min</text>
    <text x="645" y="100" font-size="11" fill="#64748B" text-anchor="middle">Personnalisable par client</text>
    <text x="645" y="140" font-size="11" fill="#16A34A" text-anchor="middle">▶ Configurer les rappels</text>
    
    <rect x="0" y="180" width="410" height="160" rx="12" fill="url(#cardGrad)" stroke="#E4E9E6"/>
    <rect x="10" y="10" width="120" height="30" rx="6" fill="#FEF3C7"/>
    <text x="70" y="30" font-family="Inter" font-size="12" font-weight="600" fill="#CA8A04" text-anchor="middle">Gestion retards & absences</text>
    <text x="70" y="65" font-size="11" fill="#64748B" text-anchor="middle">Alerte 15min avant si absent</text>
    <text x="70" y="85" font-size="11" fill="#64748B" text-anchor="middle">Relance H+15min + report 1-clic</text>
    <text x="70" y="105" font-size="11" fill="#64748B" text-anchor="middle">Stats ponctualité par client</text>
    <text x="70" y="140" font-size="11" fill="#CA8A04" text-anchor="middle">▶ Voir le dashboard</text>
    
    <rect x="430" y="180" width="410" height="160" rx="12" fill="url(#cardGrad)" stroke="#E4E9E6"/>
    <rect x="440" y="10" width="120" height="30" rx="6" fill="#E8F5FF"/>
    <text x="645" y="30" font-family="Inter" font-size="12" font-weight="600" fill="#2A8AFF" text-anchor="middle">Calendrier ICS abonnable</text>
    <text x="645" y="65" font-size="11" fill="#64748B" text-anchor="middle">Token par staff (régénérable)</text>
    <text x="645" y="85" font-size="11" fill="#64748B" text-anchor="middle">Google / Apple / Outlook / Calendly</text>
    <text x="645" y="105" font-size="11" fill="#64748B" text-anchor="middle">Filtré par rôle (coach ≠ mental)</text>
    <text x="645" y="140" font-size="11" fill="#2A8AFF" text-anchor="middle">▶ Générer le token ICS</text>
  </g>
  
  <g transform="translate(340, 420)">
    <rect x="0" y="0" width="410" height="140" rx="12" fill="url(#cardGrad)" stroke="#E4E9E6"/>
    <rect x="10" y="10" width="120" height="30" rx="6" fill="#E8E8F5"/>
    <text x="70" y="30" font-family="Inter" font-size="12" font-weight="600" fill="#433BFF" text-anchor="middle">Vue agenda coach</text>
    <text x="70" y="65" font-size="11" fill="#64748B" text-anchor="middle">Semaine / Mois / Liste / Charge</text>
    <text x="70" y="85" font-size="11" fill="#64748B" text-anchor="middle">Filtres : client, type, statut</text>
    <text x="70" y="105" font-size="11" fill="#64748B" text-anchor="middle">Drag-and-drop report + création rapide</text>
    <text x="70" y="120" font-size="11" fill="#433BFF" text-anchor="middle">▶ Ouvrir l'agenda</text>
    
    <rect x="430" y="0" width="410" height="140" rx="12" fill="url(#cardGrad)" stroke="#E4E9E6"/>
    <rect x="440" y="10" width="120" height="30" rx="6" fill="#FEF3C7"/>
    <text x="645" y="30" font-family="Inter" font-size="12" font-weight="600" fill="#CA8A04" text-anchor="middle">Intégré au journal coaching</text>
    <text x="645" y="65" font-size="11" fill="#64748B" text-anchor="middle">Entrée auto post-appel (pré-remplie)</text>
    <text x="645" y="85" font-size="11" fill="#64748B" text-anchor="middle">Client, date, type, durée auto</text>
    <text x="645" y="105" font-size="11" fill="#64748B" text-anchor="middle">Vue charge : nb appels/semaine</text>
    <text x="645" y="125" font-size="11" fill="#CA8A04" text-anchor="middle">▶ Voir l'intégration</text>
  </g>
  
  <!-- Tech Specs -->
  <rect x="340" y="580" width="840" height="56" rx="12" fill="#F7F5F1" stroke="#E4E9E6"/>
  <text x="380" y="625" font-family="Inter" font-size="15" font-weight="600" fill="#2A8AFF">Spécifications techniques</text>
  <g font-family="Inter" font-size="12" fill="#64748B">
    <text x="380" y="620">🔑 Token calendrier par staff (régénérable, révocable, scope)</text>
    <text x="620" y="620">🔄 Sync Google / Apple / Outlook natif</text>
    <text x="380" y="635">🔗 Webhook call.scheduled / completed / missed</text>
    <text x="620" y="635">📝 Intégré journal : entrée auto post-appel</text>
  </g>
  
  <!-- Bottom Actions -->
  <rect x="340" y="600" width="380" height="56" rx="12" fill="url(#accentGrad)" filter="url(#shadow)"/>
  <text x="530" y="35" font-family="Inter" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Rejoindre Optibilan Agenda</text>
  <text x="510" y="35" font-size="14" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">→</text>
  
  <rect x="760" y="600" width="180" height="56" rx="12" stroke="#2A8AFF" stroke-width="1.5" fill="transparent"/>
  <text x="850" y="35" font-family="Inter" font-size="15" font-weight="600" fill="#2A8AFF" text-anchor="middle">Configurer l'agenda</text>
  
</svg>