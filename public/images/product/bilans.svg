<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F7F5F1"/>
      <stop offset="100%" style="stop-color:#FFFFFF"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#F7F5F1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2A8AFF"/>
      <stop offset="100%" style="stop-color:#1466C4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2A8AFF" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="700" fill="url(#bgGrad)"/>
  
  <!-- Header Bar -->
  <rect x="40" y="30" width="1120" height="56" rx="12" fill="#FFFFFF" stroke="#E4E9E6" stroke-width="1" filter="url(#shadow)"/>
  <text x="60" y="65" font-family="Inter, system-ui" font-size="15" font-weight="600" fill="#23211C">Bilans & Progression</text>
  <circle cx="1120" cy="58" r="16" fill="#E8F5FF"/>
  <text x="1120" y="62" font-family="Inter" font-size="14" fill="#2A8AFF" text-anchor="middle" dominant-baseline="middle">⋯</text>
  
  <!-- Sidebar -->
  <rect x="40" y="110" width="240" height="540" rx="16" fill="#FFFFFF" stroke="#E4E9E6" stroke-width="1"/>
  <text x="60" y="145" font-family="Inter" font-size="13" font-weight="600" fill="#23211C">MENU</text>
  
  <!-- Menu items -->
  <g font-family="Inter" font-size="14" fill="#64748B">
    <text x="60" y="185">Vue d'ensemble</text>
    <text x="60" y="220" font-weight="600" fill="#23211C">Bilan hebdomadaire</text>
    <text x="60" y="255">Mensurations</text>
    <text x="60" y="290">Photos avant/après</text>
    <text x="60" y="325">Ressenti & Humeur</text>
    <text x="60" y="360">Sommeil & Faim</text>
    <text x="60" y="395">Score de progression</text>
  </g>
  
  <!-- Main Content Area -->
  <rect x="300" y="110" width="860" height="540" rx="16" fill="#FFFFFF" stroke="#E4E9E6" stroke-width="1"/>
  
  <!-- Header -->
  <text x="340" y="155" font-family="Inter" font-size="22" font-weight="700" fill="#23211C">Bilan du 15 janvier 2024</text>
  <text x="340" y="185" font-size="14" fill="#64748B">Marie Dubois • Objectif : Perte de gras</text>
  
  <!-- Stats Row -->
  <g transform="translate(340, 220)">
    <!-- Stat 1 -->
    <rect x="0" y="0" width="200" height="80" rx="12" fill="url(#cardGrad)" stroke="#E4E9E6"/>
    <text x="100" y="30" font-family="Inter" font-size="28" font-weight="700" fill="#2A8AFF" text-anchor="middle">78.5</text>
    <text x="100" y="55" font-size="12" fill="#64748B" text-anchor="middle">Poids (kg)</text>
    <text x="100" y="70" font-size="11" fill="#22C55E" text-anchor="middle">−1.2 kg vs sem. dernière</text>
    
    <!-- Stat 2 -->
    <rect x="220" y="0" width="200" height="80" rx="12" fill="url(#cardGrad)" stroke="#E4E9E6"/>
    <text x="320" y="30" font-size="28" font-weight="700" fill="#2A8AFF" text-anchor="middle">82</text>
    <text x="320" y="55" font-size="12" fill="#64748B" text-anchor="middle">Tour taille (cm)</text>
    <text x="320" y="70" font-size="11" fill="#22C55E" text-anchor="middle">−2 cm ce mois</text>
    
    <!-- Stat 3 -->
    <rect x="440" y="0" width="200" height="80" rx="12" fill="url(#cardGrad)" stroke="#E4E9E6"/>
    <text x="540" y="30" font-size="28" font-weight="700" fill="#2A8AFF" text-anchor="middle">8.5</text>
    <text x="540" y="55" font-size="12" fill="#64748B" text-anchor="middle">Sommeil (/10)</text>
    <text x="540" y="70" font-size="11" fill="#FACC15" text-anchor="middle">+0.5 vs semaine</text>
    
    <!-- Stat 4 -->
    <rect x="660" y="0" width="180" height="80" rx="12" fill="url(#cardGrad)" stroke="#E4E9E6"/>
    <text x="750" y="30" font-size="28" font-weight="700" fill="#2A8AFF" text-anchor="middle">8,452</text>
    <text x="750" y="55" font-size="12" fill="#64748B" text-anchor="middle">Pas quotidiens</text>
    <text x="750" y="70" font-size="11" fill="#22C55E" text-anchor="middle">Objectif atteint ✓</text>
  </g>
  
  <!-- Chart Area -->
  <rect x="340" y="330" width="840" height="280" rx="12" fill="#FAFAFA" stroke="#E4E9E6"/>
  <text x="360" y="355" font-family="Inter" font-size="16" font-weight="600" fill="#23211C">Évolution du poids (12 semaines)</text>
  
  <!-- Chart bars -->
  <g transform="translate(360, 550)">
    <g fill="#2A8AFF" opacity="0.8">
      <rect x="20" y="180" width="40" height="-120" rx="3"/>
      <rect x="80" y="180" width="40" height="-135" rx="3" fill="#1466C4"/>
      <rect x="140" y="180" width="40" height="-145" rx="3"/>
      <rect x="200" y="180" width="40" height="-150" rx="3"/>
      <rect x="260" y="180" width="40" height="-142" rx="3"/>
      <rect x="320" y="180" width="40" height="-138" rx="3"/>
      <rect x="380" y="180" width="40" height="-128" rx="3"/>
      <rect x="440" y="180" width="40" height="-120" rx="3"/>
      <rect x="500" y="180" width="40" height="-115" rx="3"/>
      <rect x="560" y="180" width="40" height="-110" rx="3"/>
      <rect x="620" y="180" width="40" height="-105" rx="3" fill="#22C55E"/>
      <rect x="680" y="180" width="40" height="-98" rx="3" fill="#22C55E"/>
    </g>
    <!-- X-axis labels -->
    <g font-family="Inter" font-size="10" fill="#94A3B8" text-anchor="middle">
      <text x="40" y="200">S1</text>
      <text x="100" y="200">S2</text>
      <text x="160" y="200">S3</text>
      <text x="220" y="200">S4</text>
      <text x="280" y="200">S5</text>
      <text x="340" y="200">S6</text>
      <text x="400" y="200">S7</text>
      <text x="460" y="200">S8</text>
      <text x="520" y="200">S9</text>
      <text x="580" y="200">S10</text>
      <text x="640" y="200">S11</text>
      <text x="740" y="200">S12</text>
    </g>
  </g>
  
  <!-- Bottom Action Bar -->
  <rect x="340" y="630" width="840" height="56" rx="12" fill="url(#accentGrad)" filter="url(#shadow)"/>
  <text x="760" y="665" font-family="Inter" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Exporter le rapport PDF</text>
  <text x="760" y="665" font-family="Inter" font-size="14" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle" x="1120">→</text>
  
</svg>