 fill="#64748b" font-size="14">Santé, agendas, notifications, automation, paiement, API REST &amp; webhooks — connecteurs natifs et API ouverte.</text><g transform="translate(340 220)"><rect width="410" height="160" fill="url(#c)" stroke="#e4e9e6" rx="12"/><rect width="120" height="30" x="10" y="10" fill="#e8f5ff" rx="6"/><text x="70" y="30" fill="#2a8aff" font-family="Inter" font-size="12" font-weight="600" text-anchor="middle">Santé connectée</text><text x="70" y="65" fill="#64748b" font-size="11" text-anchor="middle">Apple Health, Oura, Whoop, Garmin</text><text x="70" y="85" fill="#64748b" font-size="11" text-anchor="middle">Sommeil, VFC, VO2max, %MG</text><text x="70" y="105" fill="#64748b" font-size="11" text-anchor="middle">Sync partenaire → /api/health-sync</text><text x="70" y="140" fill="#2a8aff" font-size="11" text-anchor="middle">▶ Connecter la santé</text><rect width="410" height="160" x="430" fill="url(#c)" stroke="#e4e9e6" rx="12"/><rect width="120" height="30" x="440" y="10" fill="#e8f5ff" rx="6"/><text x="645" y="30" fill="#2a8aff" font-family="Inter" font-size="12" font-weight="600" text-anchor="middle">Calendriers</text><text x="645" y="65" fill="#64748b" font-size="11" text-anchor="middle">Google, Apple, Outlook, Calendly</text><text x="645" y="85" fill="#64748b" font-size="11" text-anchor="middle">Abonnement ICS par staff</text><text x="645" y="105" fill="#64748b" font-size="11" text-anchor="middle">RDV Calendly → appel Optibilan</text><text x="645" y="140" fill="#2a8aff" font-size="11" text-anchor="middle">▶ Connecter l&apos;agenda</text><rect width="410" height="160" y="180" fill="url(#c)" stroke="#e4e9e6" rx="12"/><rect width="120" height="30" x="10" y="10" fill="#e8f8f0" rx="6"/><text x="70" y="30" fill="#16a34a" font-family="Inter" font-size="12" font-weight="600" text-anchor="middle">Notifications</text><text x="70" y="65" fill="#64748b" font-size="11" text-anchor="middle">Slack, Email (Resend), Push Web</text><text x="70" y="85" fill="#64748b" font-size="11" text-anchor="middle">Rappels bilans, séances, alertes</text><text x="70" y="105" fill="#64748b" font-size="11" text-anchor="middle">WhatsApp via n8n / Make</text><text x="70" y="140" fill="#16a34a" font-size="11" text-anchor="middle">▶ Activer les notifications</text><rect width="410" height="160" x="430" y="180" fill="url(#c)" stroke="#e4e9e6" rx="12"/><rect width="120" height="30" x="440" y="10" fill="#fef3c7" rx="6"/><text x="645" y="30" fill="#ca8a04" font-family="Inter" font-size="12" font-weight="600" text-anchor="middle">Automatisation</text><text x="645" y="65" fill="#64748b" font-size="11" text-anchor="middle">n8n, Make, Zapier</text><text x="645" y="85" fill="#64748b" font-size="11" text-anchor="middle">Notion note.created → base</text><text x="645" y="105" fill="#64748b" font-size="11" text-anchor="middle">5000+ apps via webhooks</text><text x="645" y="140" fill="#ca8a04" font-size="11" text-anchor="middle">▶ Voir les connecteurs</text></g><g transform="translate(340 420)"><rect width="410" height="140" fill="url(#c)" stroke="#e4e9e6" rx="12"/><rect width="120" height="30" x="10" y="10" fill="#e8e5f5" rx="6"/><text x="70" y="30" fill="#433bff" font-family="Inter" font-size="12" font-weight="600" text-anchor="middle">Paiements</text><text x="70" y="65" fill="#64748b" font-size="11" text-anchor="middle">Stripe natif, SEPA virement</text><text x="70" y="85" fill="#64748b" font-size="11" text-anchor="middle">Abonnements, portail client</text><text x="70" y="105" fill="#64748b" font-size="11" text-anchor="middle">Webhooks facture, impayé</text><text x="70" y="120" fill="#433bff" font-size="11" text-anchor="middle">▶ Configurer Stripe</text><rect width="410" height="140" x="430" fill="url(#c)" stroke="#e4e9e6" rx="12"/><rect width="120" height="30" x="440" y="10" fill="#e8f5ff" rx="6"/><text x="645" y="30" fill="#2a8aff" font-family="Inter" font-size="12" font-weight="600" text-anchor="middle">API REST v1</text><text x="645" y="65" fill="#64748b" font-size="11" text-anchor="middle">OpenAPI 3.1 complet</text><text x="645" y="85" fill="#64748b" font-size="11" text-anchor="middle">Webhooks signés HMAC, 8 events</text><text x="645" y="105" fill="#64748b" font-size="11" text-anchor="middle">Sandbox test, SSO/SAML bientôt</text><text x="645" y="125" fill="#2a8aff" font-size="11" text-anchor="middle">▶ Ouvrir la doc API</text></g><rect width="840" height="56" x="340" y="580" fill="#f7f5f1" stroke="#e4e9e6" rx="12"/><text x="380" y="625" fill="#2a8aff" font-family="Inter" font-size="15" font-weight="600">Spécifications techniques</text><g fill="#64748b" font-family="Inter" font-size="12"><text x="380" y="620">🔑 API REST OpenAPI 3.1 + clés scopées</text><text x="620" y="620">🔄 Webhooks HMAC signés, idempotents</text><text x="380" y="635">🔗 Connecteurs natifs santé + agendas</text><text x="620" y="635">📝 n8n / Make / Zapier / Notion</text></g><rect width="380" height="56" x="340" y="600" fill="url(#d)" filter="url(#b)" rx="12"/><text x="530" y="35" fill="#fff" font-family="Inter" font-size="15" font-weight="700" text-anchor="middle">Découvrir les Intégrations</text><text x="510" y="35" fill="#fff" dominant-baseline="middle" font-size="14" text-anchor="middle">→</text><rect width="180" height="56" x="760" y="600" fill="transparent" stroke="#2a8aff" stroke-width="1.5" rx="12"/><text x="850" y="35" fill="#2a8aff" font-family="Inter" font-size="15" font-weight="600" text-anchor="middle">Voir la doc</text></svg>