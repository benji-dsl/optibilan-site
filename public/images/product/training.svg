<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F7F5F1"/>
      <stop offset="100%" style="stop-color:#FFFFFF"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#F7F5F1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#433BFF"/>
      <stop offset="100%" style="stop-color:#1466C4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#433BFF" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <rect width="1200" height="700" fill="url(#bgGrad)"/>
  
  <!-- Header Bar -->
  <rect x="40" y="30" width="1120" height="56" rx="12" fill="#FFFFFF" stroke="#E4E9E6" stroke-width="1" filter="url(#shadow)"/>
  <text x="60" y="65" font-family="Inter, system-ui" font-size="15" font-weight="600" fill="#23211C">Sport & Programmes</text>
  <circle cx="1120" cy="58" r="16" fill="#E8E8F5"/>
  <text x="1120" y="62" font-family="Inter" font-size="14" fill="#433BFF" text-anchor="middle" dominant-baseline="middle">⋯</text>
  
  <!-- Sidebar -->
  <rect x="40" y="110" width="240" height="540" rx="16" fill="#FFFFFF" stroke="#E4E9E6" stroke-width="1"/>
  <text x="60" y="145" font-family="Inter" font-size="13" font-weight="600" fill="#23211C">MENU</text>
  <g font-family="Inter" font-size="14" fill="#64748B">
    <text x="60" y="185">Bibliothèque</text>
    <text x="60" y="220" font-weight="600" fill="#23211C">Créer séance</text>
    <text x="60" y="255">Programmes</text>
    <text x="60" y="290">Progression</text>
    <text x="60" y="325">Import FitFocus</text>
  </g>
  
  <!-- Main Content -->
  <rect x="300" y="110" width="860" height="540" rx="16" fill="#FFFFFF" stroke="#E4E9E6" stroke-width="1"/>
  
  <!-- Header -->
  <text x="340" y="155" font-family="Inter" font-size="22" font-weight="700" fill="#23211C">Programme Force Hypertrophie - Semaine 3</text>
  <text x="340" y="185" font-size="14" fill="#64748B">Thomas Bertrand • 4 séances/semaine • Force/Hypertrophie</text>
  
  <!-- Program Overview Cards -->
  <g transform="translate(340, 220)">
    <!-- Session 1 -->
    <rect x="0" y="0" width="410" height="160" rx="12" fill="url(#cardGrad)" stroke="#E4E9E6"/>
    <rect x="10" y="10" width="120" height="30" rx="6" fill="#E8E8F5"/>
    <text x="70" y="30" font-family="Inter" font-size="12" font-weight="600" fill="#433BFF" text-anchor="middle">Séance A - Push</text>
    <text x="100" y="65" font-size="18" font-weight="700" fill="#433BFF" text-anchor="middle">4 exercices • 16 séries</text>
    <g font-family="Inter" font-size="11" fill="#64748B">
      <text x="100" y="90" text-anchor="middle">Développé couché • 4×6-8 • 85kg</text>
      <text x="100" y="110" text-anchor="middle">Développé militaire • 3×8-10 • 55kg</text>
      <text x="100" y="130" text-anchor="middle">Développé incliné • 3×10-12 • 40kg</text>
      <text x="100" y="150" text-anchor="middle">Élévations latérales • 3×15 • 12kg</text>
    </g>
    
    <!-- Session 2 -->
    <rect x="430" y="0" width="410" height="160" rx="12" fill="url(#cardGrad)" stroke="#E4E9E6"/>
    <rect x="440" y="10" width="120" height="30" rx="6" fill="#E8F5E9"/>
    <text x="645" y="30" font-family="Inter" font-size="12" font-weight="600" fill="#16A34A" text-anchor="middle">Séance B - Pull</text>
    <text x="645" y="65" font-size="18" font-weight="700" fill="#16A34A" text-anchor="middle">5 exercices • 18 séries</text>
    <g font-family="Inter" font-size="11" fill="#64748B">
      <text x="645" y="90" text-anchor="middle">Tractions • 4×6-8 • Lesté 10kg</text>
      <text x="645" y="110" text-anchor="middle">Rowing barre • 4×8-10 • 70kg</text>
      <text x="645" y="130" text-anchor="middle">Face pulls • 3×15-20 • 15kg</text>
      <text x="645" y="150" text-anchor="middle">Curl marteau • 3×10-12 • 20kg</text>
    </g>
  </g>
  
  <!-- Session 3 & 4 -->
  <g transform="translate(340, 400)">
    <rect x="0" y="0" width="410" height="160" rx="12" fill="url(#cardGrad)" stroke="#E4E9E6"/>
    <rect x="10" y="10" width="120" height="30" rx="6" fill="#FEF3C7"/>
    <text x="70" y="30" font-family="Inter" font-size="12" font-weight="600" fill="#CA8A04" text-anchor="middle">Séance C - Legs</text>
    <text x="100" y="65" font-size="18" font-weight="700" fill="#CA8A04" text-anchor="middle">6 exercices • 22 séries</text>
    <g font-family="Inter" font-size="11" fill="#64748B">
      <text x="100" y="90" text-anchor="middle">Squat • 4×6-8 • 120kg</text>
      <text x="100" y="110" text-anchor="middle">Presse jambes • 3×12-15 • 180kg</text>
      <text x="100" y="130" text-anchor="middle">Fentes bulgares • 3×10-12 • 20kg</text>
      <text x="100" y="150" text-anchor="middle">Extensions jambes • 3×15-20 • 45kg</text>
    </g>
    
    <rect x="430" y="0" width="410" height="160" rx="12" fill="url(#cardGrad)" stroke="#E4E9E6"/>
    <rect x="440" y="10" width="120" height="30" rx="6" fill="#FEF3C7"/>
    <text x="645" y="30" font-family="Inter" font-size="12" font-weight="600" fill="#CA8A04" text-anchor="middle">Séance D - Full Body</text>
    <text x="645" y="65" font-size="18" font-weight="700" fill="#CA8A04" text-anchor="middle">5 exercices • 18 séries</text>
    <g font-family="Inter" font-size="11" fill="#64748B">
      <text x="645" y="90" text-anchor="middle">Soulevé de terre • 3×5 • 140kg</text>
      <text x="645" y="110" text-anchor="middle">Dips • 3×8-10 • Poids corps</text>
      <text x="645" y="130" text-anchor="middle">Gainage • 3×60s</text>
      <text x="645" y="150" text-anchor="middle">Gainage latéral • 2×45s</text>
    </g>
  </g>
  
  <!-- Progress Chart -->
  <rect x="300" y="580" width="860" height="100" rx="12" fill="#FAFAFA" stroke="#E4E9E6"/>
  <text x="340" y="605" font-family="Inter" font-size="16" font-weight="600" fill="#23211C">Progression charge - Développé couché (12 semaines)</text>
  <g transform="translate(340, 650)">
    <g fill="#433BFF" opacity="0.8">
      <rect x="30" y="60" width="40" height="-80" rx="3"/>
      <rect x="90" y="60" width="40" height="-95" rx="3"/>
      <rect x="150" y="60" width="40" height="-105" rx="3"/>
      <rect x="210" y="60" width="40" height="-110" rx="3"/>
      <rect x="270" y="60" width="40" height="-105" rx="3"/>
      <rect x="330" y="60" width="40" height="-115" rx="3"/>
      <rect x="390" y="60" width="40" height="-118" rx="3"/>
      <rect x="450" y="60" width="40" height="-120" rx="3"/>
      <rect x="510" y="60" width="40" height="-122" rx="3"/>
      <rect x="570" y="60" width="40" height="-125" rx="3"/>
      <rect x="630" y="60" width="40" height="-128" rx="3" fill="#22C55E"/>
      <rect x="690" y="60" width="40" height="-130" rx="3" fill="#22C55E"/>
    </g>
    <g font-family="Inter" font-size="10" fill="#94A3B8" text-anchor="middle">
      <text x="50" y="15">S1</text><text x="110" y="15">S2</text><text x="170" y="15">S3</text>
      <text x="230" y="15">S4</text><text x="290" y="15">S5</text><text x="350" y="15">S6</text>
      <text x="410" y="15">S7</text><text x="470" y="15">S8</text><text x="530" y="15">S9</text>
      <text x="590" y="15">S10</text><text x="650" y="15">S11</text><text x="710" y="15">S12</text>
    </g>
  </g>
  
  <!-- Bottom Actions -->
  <rect x="340" y="600" width="380" height="56" rx="12" fill="#433BFF" filter="url(#shadow)"/>
  <text x="230" y="35" font-family="Inter" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Voir la progression complète</text>
  <text x="370" y="35" font-size="14" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">→</text>
  
  <rect x="760" y="600" width="180" height="56" rx="12" stroke="#433BFF" stroke-width="1.5" fill="transparent"/>
  <text x="850" y="35" font-family="Inter" font-size="15" font-weight="600" fill="#433BFF" text-anchor="middle">Créer séance</text>
  
</svg>