<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F7F5F1"/>
      <stop offset="100%" style="stop-color:#FFFFFF"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#F7F5F1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2A8AFF"/>
      <stop offset="100%" style="stop-color:#1466C4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2A8AFF" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <rect width="1200" height="700" fill="url(#bgGrad)"/>
  
  <!-- Header Bar -->
  <rect x="40" y="30" width="1120" height="56" rx="12" fill="#FFFFFF" stroke="#E4E9E6" stroke-width="1" filter="url(#shadow)"/>
  <text x="60" y="65" font-family="Inter, system-ui" font-size="15" font-weight="600" fill="#23211C">Journal Coaching & CRM</text>
  <circle cx="1120" cy="58" r="16" fill="#E8F5FF"/>
  <text x="1120" y="62" font-family="Inter" font-size="14" fill="#2A8AFF" text-anchor="middle" dominant-baseline="middle">⋯</text>
  
  <!-- Sidebar -->
  <rect x="40" y="110" width="240" height="540" rx="16" fill="#FFFFFF" stroke="#E4E9E6" stroke-width="1"/>
  <text x="60" y="145" font-family="Inter" font-size="13" font-weight="600" fill="#23211C">MENU</text>
  <g font-family="Inter" font-size="14" fill="#64748B">
    <text x="60" y="185">Entrées</text>
    <text x="60" y="220" font-weight="600" fill="#23211C">Pièces jointes</text>
    <text x="60" y="255">Partage client</text>
    <text x="60" y="290">Pipeline CRM</text>
    <text x="60" y="325">Relances</text>
    <text x="60" y="360">Sync Notion</text>
  </g>
  
  <!-- Main Content -->
  <rect x="300" y="110" width="860" height="540" rx="16" fill="#FFFFFF" stroke="#E4E9E6" stroke-width="1"/>
  
  <!-- Header -->
  <text x="340" y="155" font-family="Inter" font-size="22" font-weight="700" fill="#23211C">Journal Coaching & CRM</text>
  <text x="340" y="185" font-size="14" fill="#64748B">Entrées typées, pièces jointes, partage client, sync Notion, pipeline commercial.</text>
  
  <!-- Feature Cards -->
  <g transform="translate(340, 220)">
    <g font-family="Inter">
      <!-- Typed Entries -->
      <rect x="0" y="0" width="410" height="200" rx="12" fill="url(#cardGrad)" stroke="#E4E9E6"/>
      <rect x="10" y="10" width="120" height="30" rx="6" fill="#E8F5FF"/>
      <text x="70" y="30" font-family="Inter" font-size="12" font-weight="600" fill="#2A8AFF" text-anchor="middle">Entrées typées</text>
      <text x="70" y="65" font-size="11" fill="#64748B" text-anchor="middle">9 types : lancement, suivi, bilan, micro, sport...</text>
      <text x="70" y="85" font-size="11" fill="#64748B" text-anchor="middle">Champs conditionnels par type</text>
      <text x="70" y="100" font-size="11" fill="#64748B" text-anchor="middle">Tags + filtres combinés</text>
      <text x="70" y="120" font-size="11" fill="#64748B" text-anchor="middle">Recherche full-text (tsvector)</text>
      <text x="70" y="140" font-size="11" fill="#64748B" text-anchor="middle">OCR auto sur PDF/images</text>
      <text x="70" y="160" font-size="11" fill="#2A8AFF" text-anchor="middle">▶ Voir les types d'entrées</text>
      
      <!-- Attachments -->
      <rect x="430" y="0" width="410" height="200" rx="12" fill="url(#cardGrad)" stroke="#E4E9E6"/>
      <rect x="440" y="10" width="120" height="30" rx="6" fill="#E8F5E9"/>
      <text x="645" y="30" font-family="Inter" font-size="12" font-weight="600" fill="#16A34A" text-anchor="middle">Pièces jointes</text>
      <text x="645" y="65" font-size="11" fill="#64748B" text-anchor="middle">PDF, images, audio, vidéo (100Mo max)</text>
      <text x="645" y="85" font-size="11" fill="#64748B" text-anchor="middle">Stockage Supabase + CDN Cloudflare</text>
      <text x="645" y="100" font-size="11" fill="#64748B" text-anchor="middle">Aperçu in-app + OCR auto</text>
      <text x="645" y="120" font-size="11" fill="#64748B" text-anchor="middle">URL signée courte (1h)</text>
      <text x="645" y="160" font-size="11" fill="#16A34A" text-anchor="middle">▶ Voir la gestion fichiers</text>
      
      <!-- Client Sharing -->
      <rect x="0" y="220" width="410" height="200" rx="12" fill="url(#cardGrad)" stroke="#E4E9E6"/>
      <rect x="10" y="10" width="120" height="30" rx="6" fill="#FEF3C7"/>
      <text x="70" y="30" font-family="Inter" font-size="12" font-weight="600" fill="#CA8A04" text-anchor="middle">Partage client</text>
      <text x="70" y="65" font-size="11" fill="#64748B" text-anchor="middle">3 niveaux : visible / privé / commentaire</text>
      <text x="70" y="85" font-size="11" fill="#64748B" text-anchor="middle">Notif push/email si partage visible</text>
      <text x="70" y="105" font-size="11" fill="#64748B" text-anchor="middle">Journal des partages (qui, quand)</text>
      <text x="70" y="140" font-size="11" fill="#64748B" text-anchor="middle">Révocation possible à tout moment</text>
      <text x="70" y="160" font-size="11" fill="#CA8A04" text-anchor="middle">▶ Configurer le partage</text>
      
      <!-- Pipeline CRM -->
      <rect x="430" y="220" width="410" height="200" rx="12" fill="url(#cardGrad)" stroke="#E4E9E6"/>
      <rect x="440" y="10" width="120" height="30" rx="6" fill="#FEF3C7"/>
      <text x="645" y="30" font-family="Inter" font-size="12" font-weight="600" fill="#CA8A04" text-anchor="middle">Pipeline CRM</text>
      <text x="645" y="65" font-size="11" fill="#64748B" text-anchor="middle">6 stages : prospect → essai → actif → risque → réactivation → archive</text>
      <text x="645" y="85" font-size="11" fill="#64748B" text-anchor="middle">LTV auto + segmentation RFM</text>
      <text x="645" y="105" font-size="11" fill="#64748B" text-anchor="middle">Alertes churn : inactivité, signaux faibles</text>
      <text x="645" y="140" font-size="11" fill="#64748B" text-anchor="middle">Relances auto : 7/14/30j, anniversaire, upsell</text>
      <text x="645" y="160" font-size="11" fill="#CA8A04" text-anchor="middle">▶ Configurer le pipeline</text>
    </g>
    
    <!-- Sync Notion & Tasks -->
    <g transform="translate(340, 480)">
      <rect x="0" y="0" width="410" height="140" rx="12" fill="url(#cardGrad)" stroke="#E4E9E6"/>
      <rect x="10" y="10" width="120" height="30" rx="6" fill="#E8E8F5"/>
      <text x="70" y="30" font-family="Inter" font-size="12" font-weight="600" fill="#433BFF" text-anchor="middle">Sync Notion via n8n</text>
      <text x="70" y="65" font-size="11" fill="#64748B" text-anchor="middle">Webhook note.created → base Notion</text>
      <text x="70" y="85" font-size="11" fill="#64748B" text-anchor="middle">Bidirectionnel : Notion → Optibilan</text>
      <text x="70" y="105" font-size="11" fill="#64748B" text-anchor="middle">Mapping champs personnalisable</text>
      <text x="70" y="120" font-size="11" fill="#64748B" text-anchor="middle">Filtre visibilité (privé = non sync)</text>
      
      <rect x="430" y="0" width="410" height="140" rx="12" fill="url(#cardGrad)" stroke="#E4E9E6"/>
      <rect x="440" y="10" width="120" height="30" rx="6" fill="#E8F5E9"/>
      <text x="645" y="30" font-family="Inter" font-size="12" font-weight="600" fill="#16A34A" text-anchor="middle">Relances & Tâches</text>
      <text x="645" y="65" font-size="11" fill="#64748B" text-anchor="middle">Tâches assignées + échéance + priorité</text>
      <text x="645" y="85" font-size="11" fill="#64748B" text-anchor="middle">Rappels Slack/email/push + ICS</text>
      <text x="645" y="105" font-size="11" fill="#64748B" text-anchor="middle">Checklists onboarding/offboarding</text>
      <text x="645" y="140" font-size="11" fill="#16A34A" text-anchor="middle">▶ Configurer les relances</text>
    </g>
    
    <!-- Tech Specs -->
    <rect x="340" y="620" width="840" height="56" rx="12" fill="#F7F5F1" stroke="#E4E9E6"/>
    <text x="380" y="650" font-family="Inter" font-size="15" font-weight="600" fill="#2A8AFF">Spécifications techniques</text>
    <g font-family="Inter" font-size="12" fill="#64748B">
      <text x="380" y="660">🔍 Full-text search PostgreSQL (tsvector) sur entrées + pièces jointes OCR</text>
      <text x="380" y="675">🔗 API journal : entrées, pièces jointes, partage, tags</text>
      <text x="620" y="660">🔗 Webhook note.created / note.shared</text>
      <text x="380" y="675">🔗 API CRM : pipeline, stages, LTV, RFM, tâches</text>
    </g>
  </g>
  
  <!-- Bottom Actions -->
  <rect x="340" y="630" width="380" height="56" rx="12" fill="url(#accentGrad)" filter="url(#shadow)"/>
  <text x="530" y="35" font-family="Inter" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Voir le CRM en démo</text>
  <text x="510" y="35" font-size="14" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">→</text>
  
  <rect x="760" y="630" width="180" height="56" rx="12" stroke="#2A8AFF" stroke-width="1.5" fill="transparent"/>
  <text x="850" y="35" font-family="Inter" font-size="15" font-weight="600" fill="#2A8AFF" text-anchor="middle">Configurer le CRM</text>
  
</svg>