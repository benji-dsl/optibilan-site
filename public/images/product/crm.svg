<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><defs><linearGradient id="a" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#f7f5f1"/><stop offset="100%" style="stop-color:#fff"/></linearGradient><linearGradient id="c" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#fff"/><stop offset="100%" style="stop-color:#f7f5f1"/></linearGradient><linearGradient id="d" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" style="stop-color:#2a8aff"/><stop offset="100%" style="stop-color:#1466c4"/></linearGradient><filter id="b" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="4" flood-color="#2a8aff" flood-opacity=".15" stdDeviation="8"/></filter></defs><path fill="url(#a)" d="M0 0h1200v700H0z"/><rect width="1120" height="56" x="40" y="30" fill="#fff" stroke="#e4e9e6" filter="url(#b)" rx="12"/><text x="60" y="65" fill="#23211c" font-family="Inter, system-ui" font-size="15" font-weight="600">Journal Coaching &amp; CRM</text><circle cx="1120" cy="58" r="16" fill="#e8f5ff"/><text x="1120" y="62" fill="#2a8aff" dominant-baseline="middle" font-family="Inter" font-size="14" text-anchor="middle">⋯</text><rect width="240" height="540" x="40" y="110" fill="#fff" stroke="#e4e9e6" rx="16"/><text x="60" y="145" fill="#23211c" font-family="Inter" font-size="13" font-weight="600">MENU</text><g fill="#64748b" font-family="Inter" font-size="14"><text x="60" y="185">Entrées</text><text x="60" y="220" fill="#23211c" font-weight="600">Pièces jointes</text><text x="60" y="255">Partage client</text><text x="60" y="290">Pipeline CRM</text><text x="60" y="325">Relances</text><text x="60" y="360">Sync Notion</text></g><rect width="860" height="540" x="300" y="110" fill="#fff" stroke="#e4e9e6" rx="16"/><text x="340" y="155" fill="#23211c" font-family="Inter" font-size="22" font-weight="700">Journal Coaching &amp; CRM</text><text x="340" y="185" fill="#64748b" font-size="14">Entrées typées, pièces jointes, partage client, sync Notion, pipeline commercial.</text><g transform="translate(340 220)"><g font-family="Inter"><rect width="410" height="200" fill="url(#c)" stroke="#e4e9e6" rx="12"/><rect width="120" height="30" x="10" y="10" fill="#e8f5ff" rx="6"/><text x="70" y="30" fill="#2a8aff" font-size="12" font-weight="600" text-anchor="middle">Entrées typées</text><text x="70" y="65" fill="#64748b" font-size="11" text-anchor="middle">9 types : lancement, suivi, bilan, micro, sport...</text><text x="70" y="85" fill="#64748b" font-size="11" text-anchor="middle">Champs conditionnels par type</text><text x="70" y="100" fill="#64748b" font-size="11" text-anchor="middle">Tags + filtres combinés</text><text x="70" y="120" fill="#64748b" font-size="11" text-anchor="middle">Recherche full-text (tsvector)</text><text x="70" y="140" fill="#64748b" font-size="11" text-anchor="middle">OCR auto sur PDF/images</text><text x="70" y="160" fill="#2a8aff" font-size="11" text-anchor="middle">▶ Voir les types d&apos;entrées</text><rect width="410" height="200" x="430" fill="url(#c)" stroke="#e4e9e6" rx="12"/><rect width="120" height="30" x="440" y="10" fill="#e8f5e9" rx="6"/><text x="645" y="30" fill="#16a34a" font-size="12" font-weight="600" text-anchor="middle">Pièces jointes</text><text x="645" y="65" fill="#64748b" font-size="11" text-anchor="middle">PDF, images, audio, vidéo (100Mo max)</text><text x="645" y="85" fill="#64748b" font-size="11" text-anchor="middle">Stockage Supabase + CDN Cloudflare</text><text x="645" y="100" fill="#64748b" font-size="11" text-anchor="middle">Aperçu in-app + OCR auto</text><text x="645" y="120" fill="#64748b" font-size="11" text-anchor="middle">URL signée courte (1h)</text><text x="645" y="160" fill="#16a34a" font-size="11" text-anchor="middle">▶ Voir la gestion fichiers</text><rect width="410" height="200" y="220" fill="url(#c)" stroke="#e4e9e6" rx="12"/><rect width="120" height="30" x="10" y="10" fill="#fef3c7" rx="6"/><text x="70" y="30" fill="#ca8a04" font-size="12" font-weight="600" text-anchor="middle">Partage client</text><text x="70" y="65" fill="#64748b" font-size="11" text-anchor="middle">3 niveaux : visible / privé / commentaire</text><text x="70" y="85" fill="#64748b" font-size="11" text-anchor="middle">Notif push/email si partage visible</text><text x="70" y="105" fill="#64748b" font-size="11" text-anchor="middle">Journal des partages (qui, quand)</text><text x="70" y="140" fill="#64748b" font-size="11" text-anchor="middle">Révocation possible à tout moment</text><text x="70" y="160" fill="#ca8a04" font-size="11" text-anchor="middle">▶ Configurer le partage</text><rect width="410" height="200" x="430" y="220" fill="url(#c)" stroke="#e4e9e6" rx="12"/><rect width="120" height="30" x="440" y="10" fill="#fef3c7" rx="6"/><text x="645" y="30" fill="#ca8a04" font-size="12" font-weight="600" text-anchor="middle">Pipeline CRM</text><text x="645" y="65" fill="#64748b" font-size="11" text-anchor="middle">6 stages : prospect → essai → actif → risque → réactivation → archive</text><text x="645" y="85" fill="#64748b" font-size="11" text-anchor="middle">LTV auto + segmentation RFM</text><text x="645" y="105" fill="#64748b" font-size="11" text-anchor="middle">Alertes churn : inactivité, signaux faibles</text><text x="645" y="140" fill="#64748b" font-size="11" text-anchor="middle">Relances auto : 7/14/30j, anniversaire, upsell</text><text x="645" y="160" fill="#ca8a04" font-size="11" text-anchor="middle">▶ Configurer le pipeline</text></g><g transform="translate(340 480)"><rect width="410" height="140" fill="url(#c)" stroke="#e4e9e6" rx="12"/><rect width="120" height="30" x="10" y="10" fill="#e8e8f5" rx="6"/><text x="70" y="30" fill="#433bff" font-family="Inter" font-size="12" font-weight="600" text-anchor="middle">Sync Notion via n8n</text><text x="70" y="65" fill="#64748b" font-size="11" text-anchor="middle">Webhook note.created → base Notion</text><text x="70" y="85" fill="#64748b" font-size="11" text-anchor="middle">Bidirectionnel : Notion → Optibilan</text><text x="70" y="105" fill="#64748b" font-size="11" text-anchor="middle">Mapping champs personnalisable</text><text x="70" y="120" fill="#64748b" font-size="11" text-anchor="middle">Filtre visibilité (privé = non sync)</text><rect width="410" height="140" x="430" fill="url(#c)" stroke="#e4e9e6" rx="12"/><rect width="120" height="30" x="440" y="10" fill="#e8f5e9" rx="6"/><text x="645" y="30" fill="#16a34a" font-family="Inter" font-size="12" font-weight="600" text-anchor="middle">Relances &amp; Tâches</text><text x="645" y="65" fill="#64748b" font-size="11" text-anchor="middle">Tâches assignées + échéance + priorité</text><text x="645" y="85" fill="#64748b" font-size="11" text-anchor="middle">Rappels Slack/email/push + ICS</text><text x="645" y="105" fill="#64748b" font-size="11" text-anchor="middle">Checklists onboarding/offboarding</text><text x="645" y="140" fill="#16a34a" font-size="11" text-anchor="middle">▶ Configurer les relances</text></g><rect width="840" height="56" x="340" y="620" fill="#f7f5f1" stroke="#e4e9e6" rx="12"/><text x="380" y="650" fill="#2a8aff" font-family="Inter" font-size="15" font-weight="600">Spécifications techniques</text><g fill="#64748b" font-family="Inter" font-size="12"><text x="380" y="660">🔍 Full-text search PostgreSQL (tsvector) sur entrées + pièces jointes OCR</text><text x="380" y="675">🔗 API journal : entrées, pièces jointes, partage, tags</text><text x="620" y="660">🔗 Webhook note.created / note.shared</text><text x="380" y="675">🔗 API CRM : pipeline, stages, LTV, RFM, tâches</text></g></g><rect width="380" height="56" x="340" y="630" fill="url(#d)" filter="url(#b)" rx="12"/><text x="530" y="35" fill="#fff" font-family="Inter" font-size="15" font-weight="700" text-anchor="middle">Voir le CRM en démo</text><text x="510" y="35" fill="#fff" dominant-baseline="middle" font-size="14" text-anchor="middle">→</text><rect width="180" height="56" x="760" y="630" fill="transparent" stroke="#2a8aff" stroke-width="1.5" rx="12"/><text x="850" y="35" fill="#2a8aff" font-family="Inter" font-size="15" font-weight="600" text-anchor="middle">Configurer le CRM</text></svg>