<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F7F5F1"/>
      <stop offset="100%" style="stop-color:#FFFFFF"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#F7F5F1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7D3037"/>
      <stop offset="100%" style="stop-color:#BE185D"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#7D3037" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <rect width="1200" height="700" fill="url(#bgGrad)"/>
  
  <!-- Header Bar -->
  <rect x="40" y="30" width="1120" height="56" rx="12" fill="#FFFFFF" stroke="#E4E9E6" stroke-width="1" filter="url(#shadow)"/>
  <text x="60" y="65" font-family="Inter, system-ui" font-size="15" font-weight="600" fill="#23211C">Marque Blanche</text>
  <circle cx="1120" cy="58" r="16" fill="#FCE7F3"/>
  <text x="1120" y="62" font-family="Inter" font-size="14" fill="#BE185D" text-anchor="middle" dominant-baseline="middle">⋯</text>
  
  <!-- Sidebar -->
  <rect x="40" y="110" width="240" height="540" rx="16" fill="#FFFFFF" stroke="#E4E9E6" stroke-width="1"/>
  <text x="60" y="145" font-family="Inter" font-size="13" font-weight="600" fill="#23211C">MENU</text>
  <g font-family="Inter" font-size="14" fill="#64748B">
    <text x="60" y="185">Configuration</text>
    <text x="60" y="220" font-weight="600" fill="#23211C">Apparence</text>
    <text x="60" y="255">Domaine</text>
    <text x="60" y="290">Vocabulaire</text>
    <text x="60" y="325">Assistant IA</text>
    <text x="60" y="360">Emails</text>
    <text x="60" y="395">Mentions/CGV</text>
  </g>
  
  <!-- Main Content -->
  <rect x="300" y="110" width="860" height="540" rx="16" fill="#FFFFFF" stroke="#E4E9E6" stroke-width="1"/>
  
  <!-- Header -->
  <text x="340" y="155" font-family="Inter" font-size="22" font-weight="700" fill="#23211C">Marque Blanche Totale</text>
  <text x="340" y="185" font-size="14" fill="#64748B">Votre marque, pas la nôtre. Logo, couleurs, domaine, vocabulaire, IA, emails — tout est à vous.</text>
  
  <!-- Before/After Comparison -->
  <g transform="translate(340, 220)">
    <article class="p-6 rounded-xl border border-encre/10 bg-rose-50">
      <h3 class="font-display text-xl font-bold text-rose-700 mb-4 flex items-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg> Optibilan standard
      </h3>
      <ul class="space-y-2 text-encre/70">
        <li class="flex items-start gap-2"><svg class="w-4 h-4 text-rose-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg> Logo Optibilan visible</li>
        <li class="flex items-start gap-2"><svg class="w-4 h-4 text-rose-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg> Couleurs Optibilan (bleu/indigo)</li>
        <li class="flex items-start gap-2"><svg class="w-4 h-4 text-rose-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg> Domaine app.optibilan.com</li>
        <li class="flex items-start gap-2"><svg class="w-4 h-4 text-rose-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg> Vocabulaire "coaché / client"</li>
        <li class="flex items-start gap-2"><svg class="w-4 h-4 text-rose-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg> Assistant IA "Optibilan"</li>
        <li class="flex items-start gap-2"><svg class="w-4 h-4 text-rose-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg> Emails @optibilan.com</li>
        <li class="flex items-start gap-2"><svg class="w-4 h-4 text-rose-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg> Mentions légales Optibilan</li>
      </ul>
    </article>
    <article class="p-6 rounded-xl border border-encre/10 bg-emerald-50">
      <h3 class="font-display text-xl font-bold text-emerald-700 mb-4 flex items-center gap-2">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> Votre cabinet personnalisé
      </h3>
      <ul class="space-y-2 text-encre/70">
        <li class="flex items-start gap-2"><svg class="w-4 h-4 text-emerald-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> VOTRE logo</li>
        <li class="flex items-start gap-2"><svg class="w-4 h-4 text-emerald-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> VOS couleurs (thème complet ou palette custom)</li>
        <li class="flex items-start gap-2"><svg class="w-4 h-4 text-emerald-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> VOTRE domaine (app.votrecabinet.fr)</li>
        <li class="flex items-start gap-2"><svg class="w-4 h-4 text-emerald-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> VOTRE vocabulaire (membre / patient / client / sportif…)</li>
        <li class="flex items-start gap-2"><svg class="w-4 h-4 text-emerald-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> VOTRE assistant IA (prénom, ton, spécialité)</li>
        <li class="flex items-start gap-2"><svg class="w-4 h-4 text-emerald-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> VOS emails (@votrecabinet.fr)</li>
        <li class="flex items-start gap-2"><svg class="w-4 h-4 text-emerald-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> VOS mentions légales, CGV, RGPD</li>
      </ul>
    </article>
  </g>
  
  <!-- Customizable Elements Grid -->
  <g transform="translate(340, 480)">
    <h3 class="font-display text-xl md:text-2xl font-bold text-encre mb-4">Ce qui est personnalisable</h3>
    <div class="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
      {[
        { icon: 'logo', title: 'Logo & Favicon', desc: 'Upload SVG/PNG. Favicon auto-généré. Responsive.' },
        { icon: 'chart', title: 'Thème complet', desc: 'Couleurs primaires, secondaires, backgrounds, bordures. Mode clair/sombre. Palette custom ou presets.' },
        { icon: 'globe', title: 'Domaine custom', desc: 'Sous-domaine (app.votrecabinet.fr) ou domaine racine. DNS géré, SSL auto (Let\'s Encrypt / Cloudflare).' },
        { icon: 'document', title: 'Vocabulaire', desc: 'coaché / patient / membre / client / sportif… Partout : UI, emails, notifications, PDF.' },
        { icon: 'brain', title: 'Assistant IA', desc: 'Prénom, ton (formel/bienveillant/direct), spécialité, garde-fous, exemples de réponses.' },
        { icon: 'mail', title: 'Emails transactionnels', desc: 'Expéditeur @votrecabinet.fr. Templates HTML brandés. DKIM/SPF/DMARC sur votre domaine.' },
        { icon: 'shield', title: 'Mentions & CGV', desc: 'Vos mentions légales, CGV, politique confidentialité. Injectées dans l\'espace client et emails.' },
        { icon: 'code', title: 'CSS/JS custom (Cabinet)', desc: 'Injection code dans <head> / <body>. Tracking, chat, design avancé. Sans casser les mises à jour.' },
      ].map(item => (
        <article class="card-hover p-6 text-center group" style={`animation-delay: {item.icon * 100}ms`}>
          <div class="icon-wrapper mx-auto mb-4" aria-hidden="true" style={`background-color: var(--color-bleu-clair);`}>
            <Icon name={item.icon} class="w-7 h-7 text-bleu-signature" />
          </div>
          <h3 class="font-display text-lg font-bold text-encre mb-2">{item.title}</h3>
          <p class="text-sm text-encre/50">{item.desc}</p>
        </article>
      ))}
    </div>
    
    <!-- Plans Comparison -->
    <div class="mt-12 p-6 rounded-xl bg-gradient-to-br from-bleu-signature/5 via-papier to-bleu-lecture/5 border border-encre/10">
      <h3 class="font-display text-xl md:text-2xl font-bold text-encre mb-4">Niveaux de marque blanche par offre</h3>
      <div class="grid md:grid-cols-3 gap-6 mt-6 text-sm">
        <article class="p-4 rounded-lg bg-blanc border border-encre/10">
          <h4 class="font-semibold text-encre mb-3">Solo — Basique</h4>
          <ul class="space-y-2 text-encre/60">
            <li class="flex items-center gap-2"><svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> Logo</li>
            <li class="flex items-center gap-2"><svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> Couleurs</li>
            <li class="flex items-center gap-2"><svg class="w-4 h-4 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg> Domaine custom</li>
            <li class="flex items-center gap-2"><svg class="w-4 h-4 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg> Vocabulaire</li>
            <li class="flex items-center gap-2"><svg class="w-4 h-4 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg> Assistant IA</li>
            <li class="flex items-center gap-2"><svg class="w-4 h-4 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg> Emails custom</li>
          </ul>
        </article>
        <article class="p-4 rounded-lg bg-blanc border border-encre/10">
          <h4 class="font-semibold text-encre mb-3">Studio — Avancée</h4>
          <ul class="space-y-2 text-encre/60">
            <li class="flex items-center gap-2"><svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> Logo</li>
            <li class="flex items-center gap-2"><svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> Couleurs</li>
            <li class="flex items-center gap-2"><svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> Domaine custom</li>
            <li class="flex items-center gap-2"><svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> Vocabulaire</li>
            <li class="flex items-center gap-2"><svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> Assistant IA</li>
            <li class="flex items-center gap-2"><svg class="w-4 h-4 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg> Emails custom</li>
          </ul>
        </article>
        <article class="p-4 rounded-lg bg-blanc border border-encre/10 ring-2 ring-bleu-signature">
          <h4 class="font-semibold text-encre mb-3">Cabinet — Totale</h4>
          <ul class="space-y-2 text-encre/60">
            <li class="flex items-center gap-2"><svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> Logo</li>
            <li class="flex items-center gap-2"><svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> Couleurs</li>
            <li class="flex items-center gap-2"><svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> Domaine custom</li>
            <li class="flex items-center gap-2"><svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> Vocabulaire</li>
            <li class="flex items-center gap-2"><svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> Assistant IA</li>
            <li class="flex items-center gap-2"><svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> Emails @votrecabinet.fr</li>
            <li class="flex items-center gap-2"><svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> Mentions légales / CGV</li>
            <li class="flex items-center gap-2"><svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg> CSS/JS custom</li>
          </ul>
        </article>
      </div>
    </div>
  </g>
  
  <CTA
    title="Vous voulez voir VOTRE marque sur Optibilan ?"
    subtitle="30 minutes pour configurer votre marque blanche en live."
    primaryCTA={{ href: 'https://calendly.com/optibilan/demo', label: 'Rejoindre Optibilan Marque blanche' }}
    variant="primary"
  />
  </main>

  <Footer />
</Layout>