<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F7F5F1"/>
      <stop offset="100%" style="stop-color:#FFFFFF"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#F7F5F1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8FAFC2"/>
      <stop offset="100%" style="stop-color:#1466C4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#8FAFC2" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <rect width="1200" height="700" fill="url(#bgGrad)"/>
  
  <!-- Header Bar -->
  <rect x="40" y="30" width="1120" height="56" rx="12" fill="#FFFFFF" stroke="#E4E9E6" stroke-width="1" filter="url(#shadow)"/>
  <text x="60" y="65" font-family="Inter, system-ui" font-size="15" font-weight="600" fill="#23211C">Santé Connectée & Biomarqueurs</text>
  <circle cx="1120" cy="58" r="16" fill="#E8F5FF"/>
  <text x="1120" y="62" font-family="Inter" font-size="14" fill="#8FAFC2" text-anchor="middle" dominant-baseline="middle">⋯</text>
  
  <!-- Sidebar -->
  <rect x="40" y="110" width="240" height="540" rx="16" fill="#FFFFFF" stroke="#E4E9E6" stroke-width="1"/>
  <text x="60" y="145" font-family="Inter" font-size="13" font-weight="600" fill="#23211C">MENU</text>
  <g font-family="Inter" font-size="14" fill="#64748B">
    <text x="60" y="185">Dashboard</text>
    <text x="60" y="220" font-weight="600" fill="#23211C">Biomarqueurs sanguins</text>
    <text x="60" y="255">Wearables</text>
    <text x="60" y="290">Sommeil</text>
    <text x="60" y="325">Cardio</text>
    <text x="60" y="360">Habitudes</text>
  </g>
  
  <!-- Main Content -->
  <rect x="300" y="110" width="860" height="540" rx="16" fill="#FFFFFF" stroke="#E4E9E6" stroke-width="1"/>
  
  <!-- Header -->
  <text x="340" y="155" font-family="Inter" font-size="22" font-weight="700" fill="#23211C">Santé Connectée & Biomarqueurs</text>
  <text x="340" y="185" font-size="14" fill="#64748B">Centralisez biologie, wearables et habitudes pour une vision 360°</text>
  
  <!-- Biomarker Cards -->
  <g transform="translate(340, 220)">
    <!-- Glycémie -->
    <rect x="0" y="0" width="200" height="140" rx="12" fill="url(#cardGrad)" stroke="#E4E9E6"/>
    <rect x="10" y="10" width="180" height="30" rx="6" fill="#FEF3C7"/>
    <text x="100" y="30" font-family="Inter" font-size="12" font-weight="600" fill="#CA8A04" text-anchor="middle">Glycémie à jeun</text>
    <text x="100" y="65" font-size="28" font-weight="700" fill="#CA8A04" text-anchor="middle">0.92</text>
    <text x="100" y="90" font-size="11" fill="#64748B" text-anchor="middle">g/L • Ref: 0.70-1.00</text>
    <text x="100" y="110" font-size="11" fill="#EF4444" text-anchor="middle">⚠ Légèrement élevé</text>
    
    <!-- HbA1c -->
    <rect x="220" y="0" width="200" height="140" rx="12" fill="url(#cardGrad)" stroke="#E4E9E6"/>
    <rect x="230" y="10" width="180" height="30" rx="6" fill="#FEF3C7"/>
    <text x="320" y="30" font-family="Inter" font-size="12" font-weight="600" fill="#CA8A04" text-anchor="middle">HbA1c</text>
    <text x="320" y="65" font-size="28" font-weight="700" fill="#CA8A04" text-anchor="middle">5.6</text>
    <text x="320" y="90" font-size="11" fill="#64748B" text-anchor="middle">% • Ref: 4.0-5.6</text>
    <text x="320" y="110" font-size="11" fill="#22C55E" text-anchor="middle">✓ Optimal</text>
    
    <!-- Vitamine D -->
    <rect x="440" y="0" width="200" height="140" rx="12" fill="url(#cardGrad)" stroke="#E4E9E6"/>
    <rect x="450" y="10" width="180" height="30" rx="6" fill="#FEF3C7"/>
    <text x="540" y="30" font-family="Inter" font-size="12" font-weight="600" fill="#CA8A04" text-anchor="middle">Vitamine D</text>
    <text x="540" y="65" font-size="28" font-weight="700" fill="#CA8A04" text-anchor="middle">38</text>
    <text x="540" y="90" font-size="11" fill="#64748B" text-anchor="middle">ng/mL • Ref: 30-100</text>
    <text x="540" y="110" font-size="11" fill="#FACC15" text-anchor="middle">⚠ Insuffisant</text>
    
    <!-- Ferritine -->
    <rect x="660" y="0" width="180" height="140" rx="12" fill="url(#cardGrad)" stroke="#E4E9E6"/>
    <rect x="670" y="10" width="160" height="30" rx="6" fill="#FEF3C7"/>
    <text x="750" y="30" font-family="Inter" font-size="12" font-weight="600" fill="#CA8A04" text-anchor="middle">Ferritine</text>
    <text x="750" y="65" font-size="28" font-weight="700" fill="#CA8A04" text-anchor="middle">45</text>
    <text x="750" y="90" font-size="11" fill="#64748B" text-anchor="middle">ng/mL • Ref: 30-400</text>
    <text x="750" y="110" font-size="11" fill="#22C55E" text-anchor="middle">✓ Normal</text>
  </g>
  
  <!-- Wearables Section -->
  <g transform="translate(340, 380)">
    <text x="0" y="20" font-family="Inter" font-size="18" font-weight="700" fill="#23211C">Wearables connectés</text>
    <g transform="translate(0, 40)">
      <!-- Oura -->
      <rect x="0" y="0" width="280" height="100" rx="12" fill="url(#cardGrad)" stroke="#E4E9E6"/>
      <circle cx="40" cy="50" r="28" fill="#E8F5FF"/>
      <text x="40" y="55" font-size="24" fill="#2A8AFF" text-anchor="middle">💍</text>
      <text x="90" y="45" font-family="Inter" font-size="16" font-weight="700" fill="#23211C">Oura Ring Gen 3</text>
      <text x="90" y="70" font-size="12" fill="#64748B">Sommeil: 87/100 • VFC: 42ms • Prêt: 85%</text>
      
      <!-- Apple Health -->
      <rect x="300" y="0" width="280" height="100" rx="12" fill="url(#cardGrad)" stroke="#E4E9E6"/>
      <circle cx="340" cy="50" r="28" fill="#E8F5FF"/>
      <text x="340" y="55" font-size="24" fill="#2A8AFF" text-anchor="middle">📱</text>
      <text x="390" y="45" font-family="Inter" font-size="16" font-weight="700" fill="#23211C">Apple Health</text>
      <text x="390" y="70" font-size="12" fill="#64748B">Pas: 8,452 • FC: 62bpm • VO2max: 48</text>
      
      <!-- Garmin -->
      <rect x="600" y="0" width="280" height="100" rx="12" fill="url(#cardGrad)" stroke="#E4E9E6"/>
      <circle cx="640" cy="50" r="28" fill="#E8F5E9"/>
      <text x="640" y="55" font-size="24" fill="#16A34A" text-anchor="middle">🏃</text>
      <text x="690" y="45" font-family="Inter" font-size="16" font-weight="700" fill="#23211C">Garmin Forerunner</text>
      <text x="690" y="70" font-size="12" fill="#64748B">VO2max: 48 • Charge: 1,245 • Récup: 72%</text>
    </g>
  </g>
  
  <!-- Sleep & HRV Charts -->
  <g transform="translate(340, 520)">
    <rect x="0" y="0" width="420" height="140" rx="12" fill="#FAFAFA" stroke="#E4E9E6"/>
    <text x="20" y="25" font-family="Inter" font-size="16" font-weight="600" fill="#23211C">Score de sommeil (30 jours)</text>
    <g fill="#8FAFC2" opacity="0.8">
      <rect x="20" y="90" width="40" height="-60" rx="3"/>
      <rect x="80" y="90" width="40" height="-75" rx="3"/>
      <rect x="140" y="90" width="40" height="-65" rx="3"/>
      <rect x="200" y="90" width="40" height="-80" rx="3"/>
      <rect x="260" y="90" width="40" height="-70" rx="3"/>
      <rect x="320" y="90" width="40" height="-65" rx="3"/>
      <rect x="380" y="90" width="40" height="-75" rx="3"/>
    </g>
    
    <rect x="440" y="0" width="420" height="140" rx="12" fill="#FAFAFA" stroke="#E4E9E6"/>
    <text x="460" y="25" font-family="Inter" font-size="16" font-weight="600" fill="#23211C">VFC - rmssd (30 jours)</text>
    <g fill="#8FAFC2" opacity="0.8">
      <rect x="460" y="90" width="40" height="-45" rx="3"/>
      <rect x="520" y="90" width="40" height="-55" rx="3"/>
      <rect x="580" y="90" width="40" height="-40" rx="3"/>
      <rect x="640" y="90" width="40" height="-60" rx="3"/>
      <rect x="700" y="90" width="40" height="-50" rx="3"/>
      <rect x="760" y="90" width="40" height="-55" rx="3"/>
      <rect x="820" y="90" width="40" height="-45" rx="3"/>
    </g>
  </g>
  
  <!-- Bottom Actions -->
  <rect x="340" y="640" width="380" height="56" rx="12" fill="#8FAFC2" filter="url(#shadow)"/>
  <text x="230" y="35" font-family="Inter" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Voir les tendances complètes</text>
  <text x="370" y="35" font-size="14" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">→</text>
  
  <rect x="760" y="640" width="180" height="56" rx="12" stroke="#8FAFC2" stroke-width="1.5" fill="transparent"/>
  <text x="850" y="35" font-family="Inter" font-size="15" font-weight="600" fill="#8FAFC2" text-anchor="middle">Configurer sync</text>
  
</svg>